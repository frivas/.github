# Copy to .github/workflows/security.yml. Set codeql-languages for the repo.
# Private repos: delete the `push` trigger. The PR run already covers the change,
# and the weekly run catches new CVEs, so main does not pay for a second run.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'   # weekly, so new CVEs in unchanged code still surface
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    uses: frivas/.github/.github/workflows/security.yml@v2
    with:
      codeql-languages: '["javascript-typescript", "actions"]'
